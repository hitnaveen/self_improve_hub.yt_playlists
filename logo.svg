<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810"/>
      <stop offset="50%" style="stop-color:#080f1a"/>
      <stop offset="100%" style="stop-color:#030608"/>
    </linearGradient>

    <!-- 3D letter face gradient: light top-left to dark bottom-right -->
    <linearGradient id="letterFace" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   style="stop-color:#ffffff"/>
      <stop offset="30%"  style="stop-color:#c8eaf5"/>
      <stop offset="70%"  style="stop-color:#4895ef"/>
      <stop offset="100%" style="stop-color:#1a2a3a"/>
    </linearGradient>

    <!-- 3D shadow/depth side -->
    <linearGradient id="letterDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#005f7a"/>
      <stop offset="100%" style="stop-color:#001a26"/>
    </linearGradient>

    <!-- cyan glow line -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#00b4d8;stop-opacity:0"/>
      <stop offset="30%"  style="stop-color:#00b4d8;stop-opacity:1"/>
      <stop offset="70%"  style="stop-color:#4895ef;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4895ef;stop-opacity:0"/>
    </linearGradient>

    <!-- tagline gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#06d6a0"/>
      <stop offset="50%"  style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#4895ef"/>
    </linearGradient>

    <!-- scanline pattern for cinematic texture -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="white" opacity="0.018"/>
    </pattern>

  </defs>

  <!-- background -->
  <rect width="500" height="500" rx="72" fill="url(#bgGrad)"/>

  <!-- scanline cinematic texture overlay -->
  <rect width="500" height="500" rx="72" fill="url(#scanlines)"/>

  <!-- subtle border -->
  <rect width="500" height="500" rx="72" fill="none" stroke="#00b4d8" stroke-width="1.2" opacity="0.25"/>

  <!-- top-left corner accent lines -->
  <line x1="56" y1="56" x2="130" y2="56" stroke="#00b4d8" stroke-width="1.5" opacity="0.7"/>
  <line x1="56" y1="56" x2="56"  y2="130" stroke="#00b4d8" stroke-width="1.5" opacity="0.7"/>
  <circle cx="56" cy="56" r="3" fill="#00b4d8" opacity="0.9"/>

  <!-- bottom-right corner accent lines -->
  <line x1="444" y1="444" x2="370" y2="444" stroke="#4895ef" stroke-width="1.5" opacity="0.7"/>
  <line x1="444" y1="444" x2="444" y2="370" stroke="#4895ef" stroke-width="1.5" opacity="0.7"/>
  <circle cx="444" cy="444" r="3" fill="#4895ef" opacity="0.9"/>

  <!-- top-right small dot -->
  <circle cx="444" cy="56" r="2.5" fill="#06d6a0" opacity="0.5"/>
  <!-- bottom-left small dot -->
  <circle cx="56" cy="444" r="2.5" fill="#06d6a0" opacity="0.5"/>

  <!-- 3D EFFECT: shadow/depth layer (offset behind) -->
  <text
    x="258" y="296"
    font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
    font-size="138"
    font-weight="900"
    fill="url(#letterDepth)"
    text-anchor="middle"
    letter-spacing="2"
    opacity="0.9"
  >NEXUS</text>

  <!-- 3D EFFECT: mid layer for thickness -->
  <text
    x="256" y="294"
    font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
    font-size="138"
    font-weight="900"
    fill="#005580"
    text-anchor="middle"
    letter-spacing="2"
    opacity="0.8"
  >NEXUS</text>

  <!-- 3D EFFECT: face layer (main lit surface) -->
  <text
    x="252" y="290"
    font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
    font-size="138"
    font-weight="900"
    fill="url(#letterFace)"
    text-anchor="middle"
    letter-spacing="2"
  >NEXUS</text>

  <!-- glow underline -->
  <rect x="55" y="308" width="390" height="2" rx="1" fill="url(#glowLine)"/>
  <!-- thin second line for depth -->
  <rect x="80" y="312" width="340" height="1" rx="0.5" fill="url(#glowLine)" opacity="0.4"/>

  <!-- SELF HUB tagline with gradient -->
  <text
    x="250" y="364"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-size="20"
    font-weight="400"
    fill="url(#tagGrad)"
    text-anchor="middle"
    letter-spacing="10"
  >SELF HUB</text>

  <!-- three dots separator -->
  <circle cx="226" cy="400" r="2.5" fill="#00b4d8" opacity="0.5"/>
  <circle cx="250" cy="400" r="3.5" fill="#00b4d8" opacity="0.8"/>
  <circle cx="274" cy="400" r="2.5" fill="#4895ef" opacity="0.5"/>

  <!-- ultra-thin horizontal rule top of text area -->
  <line x1="56" y1="158" x2="444" y2="158" stroke="#00b4d8" stroke-width="0.5" opacity="0.12"/>

  <!-- small cinematic label top center -->
  <text
    x="250" y="148"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="10"
    font-weight="400"
    fill="#00b4d8"
    text-anchor="middle"
    letter-spacing="5"
    opacity="0.55"
  >EST. 2026</text>

</svg>
